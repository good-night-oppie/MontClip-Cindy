          import { pathToFileURL } from "node:url";
          const payload = {"rules.mjs":{"base64":"","sha256":"d9c4ead86076ebd67c927682eeb7ddefa3a8f6813f44fc094fcaaae1a2b7c894"},"run.mjs":{"base64":"","sha256":"ead3be52e0bc3c30478555b3637465fd5a9aa13af51156076a82795941f57b48"},"policy.json":{"base64":"","sha256":"6883740084bcc26c71b9f0bbfec7282ae6de1e40c56aa602f2386e27c841e0e6"},"teammates.json":{"base64":"WwogICJEZWphIiwgIlJlYSIsICJWViIsICJKSiIsICJERCIsICJCQiIsICJHRyIsICJDaW5keSIKXQo=","sha256":"18ccd92d9a9ef6ec32ffcffbf9f2c4ab697d9bee319f298c4c8f7d3533013460"}};
          const dir = fs.mkdtempSync(path.join(os.tmpdir(), "pr-sop-"));
          for (const [name, item] of Object.entries(payload)) {
            const bytes = Buffer.from(item.base64, "base64");
            if (createHash("sha256").update(bytes).digest("hex") !== item.sha256) throw Error("checker integrity mismatch");
            fs.writeFileSync(path.join(dir, name), bytes);
          }
          try { const { main } = await import(pathToFileURL(path.join(dir, "run.mjs"))); process.exitCode = await main(); }
          catch { console.error("检查未完成：请核对只读API权限、网络及最新PR事件；不能当作通过。"); process.exitCode = 1; }
          PR_SOP_NODE
